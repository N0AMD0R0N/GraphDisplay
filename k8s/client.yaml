# The web client: nginx serves the build and proxies /api to the API server. The proxy target is filled from the
# environment (SERVER_HOST, API_PORT of the ConfigMap) when the container starts.
apiVersion: v1
kind: Service
metadata:
  name: client
  labels: { app.kubernetes.io/name: client, app.kubernetes.io/part-of: graphdisplay }
spec:
  selector: { app.kubernetes.io/name: client }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels: { app.kubernetes.io/name: client, app.kubernetes.io/part-of: graphdisplay }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: client }
  template:
    metadata:
      labels: { app.kubernetes.io/name: client, app.kubernetes.io/part-of: graphdisplay }
    spec:
      enableServiceLinks: false # the Services would inject DAL_PORT=tcp://... and shadow the ConfigMap
      containers:
        - name: client
          image: graphdisplay-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 80 }
          env:
            - name: SERVER_HOST
              valueFrom: { configMapKeyRef: { name: graphdisplay-config, key: SERVER_HOST } }
            - name: API_PORT
              valueFrom: { configMapKeyRef: { name: graphdisplay-config, key: API_PORT } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
