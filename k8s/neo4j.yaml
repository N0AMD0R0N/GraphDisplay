apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels: { app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: graphdisplay }
spec:
  selector: { app.kubernetes.io/name: neo4j }
  ports:
    - { name: bolt, port: 7687, targetPort: bolt }
    - { name: http, port: 7474, targetPort: http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels: { app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: graphdisplay }
spec:
  serviceName: neo4j
  replicas: 1 # Community Edition has no clustering
  selector:
    matchLabels: { app.kubernetes.io/name: neo4j }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: graphdisplay }
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5.26.32-community
          ports:
            - { name: bolt, containerPort: 7687 }
            - { name: http, containerPort: 7474 }
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: graphdisplay-secrets, key: NEO4J_AUTH } }
            - { name: NEO4J_server_memory_heap_initial__size, value: 512m }
            - { name: NEO4J_server_memory_heap_max__size, value: 1g }
            - { name: NEO4J_server_memory_pagecache_size, value: 256m }
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            tcpSocket: { port: bolt }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: bolt }
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
