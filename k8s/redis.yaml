apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: graphdisplay }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# A cache only (artefacts are rebuilt from Neo4j, WorkPlan §3.4), so nothing is persisted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: graphdisplay }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: graphdisplay }
    spec:
      enableServiceLinks: false # the Services would inject DAL_PORT=tcp://... and shadow the ConfigMap
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --save, '', --appendonly, 'no']
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 15
