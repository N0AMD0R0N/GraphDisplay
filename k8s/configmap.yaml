# Addresses and ports of every service, in one place: the Deployments read them with envFrom. They are the same
# variables that docker/compose.yaml takes from the environment (.env.example). Inside the cluster a service is
# reached by the name of its Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphdisplay-config
data:
  # service names and the ports they listen on
  NEO4J_HOST: neo4j
  NEO4J_BOLT_PORT: '7687'
  NEO4J_HTTP_PORT: '7474'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  DAL_HOST: dal
  DAL_PORT: '4000'
  INGEST_HOST: ingest
  INGEST_PORT: '5000'
  SERVER_HOST: server
  API_PORT: '3000'
  CLIENT_PORT: '80'
  # what the services read (docker/compose.yaml builds the same values from the names above)
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  REDIS_URL: redis://redis:6379
  DAL_URL: http://dal:4000
  INGEST_URL: http://ingest:5000
  PORT: '3000'
  # behaviour
  CACHE_TTL_SECONDS: '86400'
  EXPIRY_SWEEP_INTERVAL_SECONDS: '300'
  NEO4J_TX_TIMEOUT_MS: '5000'
  MAX_HOPS: '50'
  DEFAULT_LIMIT: '1000'
  MAX_UPLOAD_BYTES: '52428800'
  SINK_KINDS: rds,sqs
