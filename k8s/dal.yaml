# The data access layer: stateless replicas. The Service spreads the calls over them, so no separate load balancer
# (the dal-lb of docker/compose.yaml) is needed.
apiVersion: v1
kind: Service
metadata:
  name: dal
  labels: { app.kubernetes.io/name: dal, app.kubernetes.io/part-of: graphdisplay }
spec:
  selector: { app.kubernetes.io/name: dal }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dal
  labels: { app.kubernetes.io/name: dal, app.kubernetes.io/part-of: graphdisplay }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: dal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dal, app.kubernetes.io/part-of: graphdisplay }
    spec:
      enableServiceLinks: false # the Services would inject DAL_PORT=tcp://... and shadow the ConfigMap
      containers:
        - name: dal
          image: graphdisplay-dal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: NODE_ENV, value: production }
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: graphdisplay-secrets, key: NEO4J_PASSWORD } }
          envFrom:
            - configMapRef: { name: graphdisplay-config }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /dal/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /dal/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
