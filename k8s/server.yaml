apiVersion: v1
kind: Service
metadata:
  name: server
  labels: { app.kubernetes.io/name: server, app.kubernetes.io/part-of: graphdisplay }
spec:
  selector: { app.kubernetes.io/name: server }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels: { app.kubernetes.io/name: server, app.kubernetes.io/part-of: graphdisplay }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: server, app.kubernetes.io/part-of: graphdisplay }
    spec:
      enableServiceLinks: false # the Services would inject DAL_PORT=tcp://... and shadow the ConfigMap
      containers:
        - name: server
          image: graphdisplay-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
          envFrom:
            - configMapRef: { name: graphdisplay-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
