# Development credentials (the same default as docker/compose.yaml). Replace them, or create this Secret outside the
# repository, before deploying anywhere that is not a local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: graphdisplay-secrets
type: Opaque
stringData:
  NEO4J_PASSWORD: graphdisplay-dev
  NEO4J_AUTH: neo4j/graphdisplay-dev
