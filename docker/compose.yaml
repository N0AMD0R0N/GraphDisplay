# Graph Display - all services (WorkPlan §7, §11.2). Only localhost ports are published.
# Every service address and port comes from the environment (see .env.example): the *_HOST variables name the
# services on the compose network, *_PORT the port a service listens on inside it, and the published (host) ports are
# CLIENT_PORT, SERVER_PORT, NEO4J_HTTP_PORT, NEO4J_BOLT_PORT and REDIS_PORT. The same variables are in k8s/configmap.yaml.
# Usage: npm run start:empty (docker compose -f docker/compose.yaml up --build). It starts empty; to seed a graph add
# docker/compose.seed.yaml (npm start does that with the example graph).
name: graphdisplay

x-node-env: &node-env
  NODE_ENV: production

services:
  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphdisplay-dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-graphdisplay-dev}' 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [graphdisplay]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [graphdisplay]

  dal:
    build:
      context: ..
      dockerfile: docker/dal.Dockerfile
    environment:
      <<: *node-env
      DAL_PORT: ${DAL_PORT:-4000}
      NEO4J_URI: bolt://${NEO4J_HOST:-neo4j}:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphdisplay-dev}
      REDIS_URL: redis://${REDIS_HOST:-redis}:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      EXPIRY_SWEEP_INTERVAL_SECONDS: ${EXPIRY_SWEEP_INTERVAL_SECONDS:-300}
      NEO4J_TX_TIMEOUT_MS: ${NEO4J_TX_TIMEOUT_MS:-5000}
    deploy:
      replicas: ${DAL_REPLICAS:-2}
    depends_on:
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:${DAL_PORT:-4000}/dal/health | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [graphdisplay]

  dal-lb:
    image: nginx:1.27-alpine
    # nginx fills the ${...} of the template from the environment (docker-entrypoint envsubst)
    environment:
      DAL_HOST: ${DAL_HOST:-dal}
      DAL_PORT: ${DAL_PORT:-4000}
    volumes:
      - ./dal-lb.nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      dal: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:${DAL_PORT:-4000}/dal/health | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [graphdisplay]

  ingest:
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
    environment:
      <<: *node-env
      INGEST_PORT: ${INGEST_PORT:-5000}
      DAL_URL: http://${DAL_LB_HOST:-dal-lb}:${DAL_PORT:-4000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      SINK_KINDS: ${SINK_KINDS:-rds,sqs}
    depends_on:
      dal-lb: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:${INGEST_PORT:-5000}/ingest/health | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [graphdisplay]

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      <<: *node-env
      PORT: ${API_PORT:-3000}
      DAL_URL: http://${DAL_LB_HOST:-dal-lb}:${DAL_PORT:-4000}
      INGEST_URL: http://${INGEST_HOST:-ingest}:${INGEST_PORT:-5000}
      MAX_HOPS: ${MAX_HOPS:-50}
      DEFAULT_LIMIT: ${DEFAULT_LIMIT:-1000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    ports:
      - '127.0.0.1:${SERVER_PORT:-3001}:${API_PORT:-3000}'
    depends_on:
      ingest: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:${API_PORT:-3000}/health | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [graphdisplay]

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    environment:
      SERVER_HOST: ${SERVER_HOST:-server}
      API_PORT: ${API_PORT:-3000}
    ports:
      - '127.0.0.1:${CLIENT_PORT:-8080}:80'
    depends_on:
      server: { condition: service_healthy }
    networks: [graphdisplay]

volumes:
  neo4j-data:
  neo4j-logs:

networks:
  graphdisplay:
    driver: bridge
