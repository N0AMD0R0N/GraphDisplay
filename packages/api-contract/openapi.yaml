openapi: 3.0.3
info:
  title: Graph Display API
  version: 0.1.0
  description: >
    Public REST API of the System Graph Explorer. Graphs are uploaded as JSON (services, databases and queues
    as nodes, calls as edges) and queried for routes: directed simple paths, filtered by node properties,
    route length and set operations. Results are Route objects that can be rendered by the UI.
servers:
  - url: /api
    description: Through the UI's nginx (the API server itself serves these paths at the root)
paths:
  /graphs:
    post:
      operationId: uploadGraph
      summary: Upload a graph
      description: >
        Validates and stores a graph. `201` when complete; `207` when elements were missing but could be derived
        (each one is listed in `results` with a 422 entry); `401` when the format is invalid.
      parameters:
        - { name: name, in: query, required: false, schema: { type: string }, description: Label shown in the UI }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InputGraph' }
      responses:
        '201':
          {
            description: Stored,
            content: { application/json: { schema: { $ref: '#/components/schemas/UploadResponse' } } },
          }
        '207':
          {
            description: Stored; missing nodes were derived,
            content: { application/json: { schema: { $ref: '#/components/schemas/UploadResponse' } } },
          }
        '401':
          {
            description: Invalid graph format,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '413':
          {
            description: Upload too large,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
    get:
      operationId: listGraphs
      summary: List graphs
      responses:
        '200':
          {
            description: Graphs,
            content:
              { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GraphSummary' } } } },
          }
  /graphs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGraph
      summary: Graph metadata and warnings
      responses:
        '200':
          {
            description: The graph,
            content: { application/json: { schema: { $ref: '#/components/schemas/GraphSummary' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteGraph
      summary: Delete a graph and everything cached for it
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/nodes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getNodes
      summary: Nodes by id (all their original properties)
      description: >
        The routes returned by a query list node ids only. This returns the nodes for ids you ask for (at most 1000
        per request; repeat the `id` parameter). Unknown ids are left out; the others are returned in the order requested.
      parameters:
        - {
            name: id,
            in: query,
            required: true,
            style: form,
            explode: true,
            schema: { type: array, items: { type: string }, minItems: 1, maxItems: 1000 },
          }
      responses:
        '200':
          {
            description: The nodes,
            content:
              { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GraphNode' } } } },
          }
        '400':
          {
            description: No ids,
            or more than 1000,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/edges:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEdges
      summary: Edges by id (normalised, one object per edge)
      description: The edge ids of a route are `from->to`. At most 1000 ids per request; repeat the `id` parameter.
      parameters:
        - {
            name: id,
            in: query,
            required: true,
            style: form,
            explode: true,
            schema: { type: array, items: { type: string }, minItems: 1, maxItems: 1000 },
          }
      responses:
        '200':
          {
            description: The edges,
            content:
              { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GraphEdge' } } } },
          }
        '400':
          {
            description: No ids,
            or more than 1000,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/schema:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSchema
      summary: Queryable properties and kind colours (feeds the query builder and the renderer)
      responses:
        '200':
          {
            description: Schema,
            content: { application/json: { schema: { $ref: '#/components/schemas/GraphSchema' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/view:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getView
      summary: The graph as a laid-out view of at most 200 nodes (ranked by degree)
      parameters:
        - {
            name: pin,
            in: query,
            required: false,
            schema: { type: string },
            description: Comma separated node ids that must be shown,
          }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/GraphView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/view/expand:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: expandView
      summary: Load the neighbours of a node ("+N" stub) or a hidden component into a view
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpandRequest' } } }
      responses:
        '200':
          {
            description: The extended view,
            content: { application/json: { schema: { $ref: '#/components/schemas/GraphView' } } },
          }
        '400':
          {
            description: Invalid request,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /graphs/{id}/routes/query:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: queryRoutes
      summary: Find routes
      description: >
        Evaluates a set tree (union / intersect / except) whose leaves are builder condition trees or raw Cypher.
        Raw queries must be read-only, scoped with `$g` and return one path or node variable.
        The query is part of the URL, so it can be bookmarked and shared; the UI mirrors it in its own address bar.
      parameters:
        - name: q
          in: query
          required: true
          description: The query as JSON (a SetTree, see the SetTree schema), URL-encoded.
          schema: { type: string }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 },
          }
        - {
            name: maxHops,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: routeMode, in: query, required: false, schema: { type: string, enum: [all, maximal], default: all } }
        - name: includeSubRoutes
          in: query
          required: false
          description: >
            By default a route that lies inside another route of the result (the same nodes in the same order, so the
            same edges) is left out, so no returned route is part of another. Set to true to get the sub-routes too.
          schema: { type: boolean, default: false }
      responses:
        '200':
          {
            description: Routes sorted by node count (longest first),
            content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } },
          }
        '400':
          {
            description: '"q" is missing or is not valid JSON',
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          {
            description: Invalid or rejected query,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '504':
          {
            description: The query exceeded the time limit,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /graphs/{id}/links:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: linkGraphs
      summary: Reserved - connect segmented graphs
      responses:
        '501':
          {
            description: Not implemented,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /health:
    get:
      operationId: health
      summary: Health of the API server and its dependencies
      responses:
        '200':
          {
            description: Health,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            status: { type: string, enum: [ok, degraded] },
                            dal: { type: string },
                            ingest: { type: string },
                          },
                      },
                  },
              },
          }
components:
  responses:
    NotFound:
      description: Unknown graph or node
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message]
          properties:
            status: { type: integer }
            code: { type: string }
            message: { type: string }
            issues:
              {
                type: array,
                items: { type: object, properties: { path: { type: string }, message: { type: string } } },
              }
    InputGraph:
      type: object
      required: [nodes]
      properties:
        nodes: { type: array, items: { $ref: '#/components/schemas/InputNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/InputEdgeGroup' } }
    InputNode:
      type: object
      required: [name]
      additionalProperties: true
      properties:
        name: { type: string, description: Unique (case-insensitive) }
        kind: { type: string }
    InputEdgeGroup:
      type: object
      required: [from, to]
      additionalProperties: true
      properties:
        from: { type: string }
        to: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            enum:
              [
                MISSING_NODE,
                DUPLICATE_EDGE,
                CYCLE,
                UNKNOWN_SEVERITY,
                TRUNCATED,
                APPROXIMATE_SET_OPERATION,
                COERCED_VALUE,
              ],
          }
        message: { type: string }
        ref: { type: string }
    IssueEntry:
      type: object
      required: [status, code, ref, message]
      properties:
        status: { type: integer, enum: [422] }
        code: { type: string, enum: [MISSING_NODE] }
        ref: { type: string }
        message: { type: string }
    GraphSummary:
      type: object
      required: [graphId, name, status, counts, createdAt, expiresAt, pinned, warnings]
      properties:
        graphId: { type: string }
        name: { type: string }
        status: { type: string, enum: [complete, incomplete] }
        counts:
          {
            type: object,
            properties: { nodes: { type: integer }, edges: { type: integer }, placeholders: { type: integer } },
          }
        createdAt: { type: integer }
        expiresAt: { type: integer, nullable: true }
        pinned: { type: boolean }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    UploadResponse:
      allOf:
        - $ref: '#/components/schemas/GraphSummary'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/IssueEntry' } }
            existing: { type: boolean }
    GraphNode:
      type: object
      required: [id, name]
      additionalProperties: true
      description: All original properties of the node plus `id` and, for derived nodes, `incomplete`.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        incomplete: { type: boolean }
    GraphEdge:
      type: object
      required: [id, from, to]
      additionalProperties: true
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
    PropertyInfo:
      type: object
      properties:
        path: { type: string }
        type: { type: string, enum: [string, number, boolean] }
        list: { type: boolean }
        count: { type: integer }
        distinct: { type: integer }
        values: { type: array, items: { type: object, properties: { value: {}, count: { type: integer } } } }
        min: { type: number }
        max: { type: number }
    GraphSchema:
      type: object
      properties:
        graphId: { type: string }
        nodeCount: { type: integer }
        edgeCount: { type: integer }
        kinds:
          {
            type: array,
            items:
              {
                type: object,
                properties: { kind: { type: string }, count: { type: integer }, color: { type: string } },
              },
          }
        properties: { type: array, items: { $ref: '#/components/schemas/PropertyInfo' } }
        sinkKinds: { type: array, items: { type: string } }
        severityScale: { type: object, additionalProperties: { type: integer } }
    ViewNode:
      type: object
      properties:
        node: { $ref: '#/components/schemas/GraphNode' }
        x: { type: number }
        y: { type: number }
        degree: { type: integer }
    GraphView:
      type: object
      properties:
        graphId: { type: string }
        nodes: { type: array, items: { $ref: '#/components/schemas/ViewNode' } }
        edges:
          {
            type: array,
            items: { type: object, properties: { id: { type: string }, from: { type: string }, to: { type: string } } },
          }
        stubs:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    id: { type: string },
                    nodeId: { type: string },
                    count: { type: integer },
                    x: { type: number },
                    y: { type: number },
                  },
              },
          }
        hiddenComponents:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    rootId: { type: string },
                    size: { type: integer },
                    sample: { type: array, items: { type: string } },
                  },
              },
          }
        hiddenComponentCount: { type: integer }
        totalNodes: { type: integer }
        shownNodes: { type: integer }
    ExpandRequest:
      type: object
      required: [nodeId, mode, visible]
      properties:
        nodeId: { type: string }
        mode: { type: string, enum: [neighbors, component] }
        visible:
          {
            type: array,
            items: { type: object, properties: { id: { type: string }, x: { type: number }, y: { type: number } } },
          }
    Condition:
      oneOf:
        - $ref: '#/components/schemas/NodeRule'
        - $ref: '#/components/schemas/LengthRule'
        - $ref: '#/components/schemas/RuleGroup'
    NodeRule:
      type: object
      required: [type, position, path, op]
      properties:
        type: { type: string, enum: [rule] }
        position: { type: string, enum: [first, last, any, all, none] }
        path: { type: string, description: Property path from the schema, e.g. vulnerabilities.severity }
        op: { type: string, enum: [eq, neq, in, contains, startsWith, exists, notExists, gt, gte, lt, lte] }
        value: {}
    LengthRule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [length] }
        min: { type: integer, minimum: 1 }
        max: { type: integer, minimum: 1 }
    RuleGroup:
      type: object
      required: [type, combinator, rules]
      properties:
        type: { type: string, enum: [group] }
        combinator: { type: string, enum: [and, or] }
        rules: { type: array, items: { $ref: '#/components/schemas/Condition' } }
    SetTree:
      oneOf:
        - $ref: '#/components/schemas/QueryLeaf'
        - $ref: '#/components/schemas/SetNode'
    QueryLeaf:
      type: object
      required: [op]
      description: Exactly one of `builder` and `text`.
      properties:
        op: { type: string, enum: [leaf] }
        language: { type: string, default: cypher }
        builder: { $ref: '#/components/schemas/RuleGroup' }
        text: { type: string }
    SetNode:
      type: object
      required: [op, args]
      properties:
        op: { type: string, enum: [union, intersect, except] }
        args: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SetTree' } }
    QueryRequest:
      type: object
      required: [query]
      properties:
        query: { $ref: '#/components/schemas/SetTree' }
        limit: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
        maxHops: { type: integer, minimum: 1, maximum: 100, default: 50 }
        routeMode: { type: string, enum: [all, maximal], default: all }
    Route:
      type: object
      required: [id, nodeIds, edgeIds, length]
      properties:
        id: { type: string }
        nodeIds: { type: array, items: { type: string } }
        edgeIds: { type: array, items: { type: string } }
        length: { type: integer, description: Number of nodes }
        closesTo: { type: string, description: Node of the route that the last node points back to (cycle marker) }
    QueryResult:
      type: object
      required: [routes, total, truncated, warnings]
      properties:
        routes: { type: array, items: { $ref: '#/components/schemas/Route' } }
        total: { type: integer, nullable: true, description: null when the result was truncated }
        truncated: { type: boolean }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
